name: Run Gemini Video Pipeline Online

on:
  workflow_dispatch:
    inputs:
      script_filename:
        description: 'Tên file kịch bản có sẵn trong repo (đặt trong thư mục inputs/):'
        required: false
        default: 'tasks.txt'
        type: string
      direct_topic:
        description: 'Hoặc nhập trực tiếp chủ đề mới (nếu không dùng file):'
        required: false
        default: ''
        type: string
  schedule:
    - cron: '0 2 * * *'

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Video Generation Tool
        env:
          GEMINI_KEYS: ${{ secrets.GEMINI_KEYS }}
          INPUT_FILENAME: ${{ github.event.inputs.script_filename }}
          INPUT_TOPIC: ${{ github.event.inputs.direct_topic }}
        run: |
          python video_generator_tool.py

      - name: Commit and Push generated files back to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add output/
          git status
          git diff --staged --quiet || (git commit -m "Auto-generate video scripts and audio assets [skip ci]" && git push)
