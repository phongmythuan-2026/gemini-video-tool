name: Run Gemini Video Pipeline Online

on:
  workflow_dispatch: # Cho phép bấm nút chạy thủ công trên GitHub
  schedule:
    - cron: '0 2 * * *' # Tự động chạy định kỳ hàng ngày lúc 2:00 UTC

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    
    # Cấp quyền ghi để GitHub Actions có thể push file lên repo
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Video Generation Tool
        env:
          GEMINI_KEYS: ${{ secrets.GEMINI_KEYS }}
        run: |
          python video_generator_tool.py

      - name: Commit and Push generated files back to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Thêm thư mục output vào git
          git add output/
          
          # Kiểm tra nếu có thay đổi (file mới sinh ra) thì thực hiện commit và push
          git status
          git diff --staged --quiet || (git commit -m "Auto-generate video scripts and audio assets [skip ci]" && git push)
