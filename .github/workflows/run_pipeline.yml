name: Run Gemini Video Pipeline Online

on:
  workflow_dispatch:
    inputs:
      script_filename:
        description: 'Tên file kịch bản trong thư mục inputs/:'
        required: false
        default: 'kich_ban_nau_an_mien_tay_6ph.xlsx'
        type: string
      aspect_ratio:
        description: 'Chọn khung hình video:'
        required: true
        default: '9:16'
        type: choice
        options:
          - '9:16'
          - '16:9'

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Video Generation Tool
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          INPUT_FILENAME: ${{ github.event.inputs.script_filename }}
          ASPECT_RATIO: ${{ github.event.inputs.aspect_ratio }}
        run: |
          python video_generator_tool.py

      - name: Commit and Push generated files back to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add output/
          git status
          git diff --staged --quiet || (git commit -m "Auto-generate real AI videos and audio assets [skip ci]" && git push)
