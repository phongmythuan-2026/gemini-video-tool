name: Run Gemini Video Pipeline Online

on:
  workflow_dispatch:
    inputs:
      script_filename:
        description: 'Tên file kịch bản trong thư mục inputs/ (để trống nếu nhập trực tiếp):'
        required: false
        default: 'tasks.txt'
        type: string
      direct_topic:
        description: 'Hoặc nhập trực tiếp chủ đề/yêu cầu mới:'
        required: false
        default: ''
        type: string
      aspect_ratio:
        description: 'Chọn khung hình video:'
        required: true
        default: '9:16'
        type: choice
        options:
          - '9:16'
          - '16:9'
      images_folder:
        description: 'Tên thư mục chứa hình ảnh đa phương thức (trong thư mục inputs/):'
        required: false
        default: ''
        type: string

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Video Generation Tool
        env:
          GEMINI_KEYS: ${{ secrets.GEMINI_KEYS }}
          INPUT_FILENAME: ${{ github.event.inputs.script_filename }}
          INPUT_TOPIC: ${{ github.event.inputs.direct_topic }}
          ASPECT_RATIO: ${{ github.event.inputs.aspect_ratio }}
          IMAGES_FOLDER: ${{ github.event.inputs.images_folder }}
        run: |
          python video_generator_tool.py

      - name: Commit and Push generated files back to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add output/
          git status
          git diff --staged --quiet || (git commit -m "Auto-generate video scripts, multi-images context, and audio assets [skip ci]" && git push)
